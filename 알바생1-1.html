<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알바생 근무입력</title>
<meta name="theme-color" content="#2e7d32">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="근무입력">
<link rel="manifest" href="worker-manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Firebase -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, push, get, onValue, remove } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
const firebaseConfig = {
  apiKey: "AIzaSyAhKNC0bkWDruBBkZbWvRPAUWEhkndPI5M",
  authDomain: "alba-pro.firebaseapp.com",
  databaseURL: "https://alba-pro-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "alba-pro",
  storageBucket: "alba-pro.firebasestorage.app",
  messagingSenderId: "783277689187",
  appId: "1:783277689187:web:df64da80d932e45586eb56"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
window._fbDb = db;
window._fbRef = ref;
window._fbPush = push;
window._fbGet = get;
window._fbRemove = remove;
// 직원 목록 로드
get(ref(db, 'alba_employees')).then(snap => {
  if(snap.exists()) {
    window._fbEmps = Object.values(snap.val());
    if(typeof renderNameList === 'function') renderNameList(window._fbEmps);
  }
}).catch(()=>{});
// 잠금해제 신호 실시간 감지
onValue(ref(db, 'alba_unlock'), (snap) => {
  const data = snap.val();
  if(!data) return;
  const profile = JSON.parse(localStorage.getItem('alba_worker_profile')||'null');
  if(!profile) return;
  // 내 코드와 일치하는 해제 신호 확인
  const keys = Object.keys(data);
  keys.forEach(k => {
    if(data[k].code === profile.code) {
      // 잠금 해제
      localStorage.removeItem('alba_worker_profile');
      remove(ref(db, 'alba_unlock/' + k));
      if(typeof unlockProfile === 'function') unlockProfile();
    }
  });
});
window._fbReady = true;
</script>
<style>
:root{--bg:#f0f7f0;--sur:#fff;--sur2:#e8f5e9;--bdr:#c8e6c9;--acc:#2e7d32;--warn:#f57c00;--bad:#c62828;--txt:#1a1a1a;--mut:#5f6368;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}
*{scrollbar-width:none;-ms-overflow-style:none;}*::-webkit-scrollbar{display:none;}
.hdr{background:linear-gradient(180deg,#43a047 0%,#2e7d32 60%,#1b5e20 100%);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:100;box-shadow:0 3px 0 #0a2e0f,0 4px 8px rgba(0,0,0,.15);}
.hdr h1{font-size:15px;font-weight:700;}
.pg{padding:14px;padding-bottom:100px;}
.card{background:#fff;border:1.5px solid var(--bdr);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 4px 0 #a5d6a7,0 5px 8px rgba(0,0,0,.08);}
.card-title{font-size:13px;font-weight:700;margin-bottom:10px;}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px;border:none;font-weight:700;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2);transition:transform .1s,box-shadow .1s;}
.btn-sm:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2);}
.btn-sm-green{background:linear-gradient(180deg,#43a047 0%,#2e7d32 100%);color:#fff;}
.btn-sm-warn{background:linear-gradient(180deg,#ffa726 0%,#f57c00 100%);color:#fff;}
.btn-sm-red{background:linear-gradient(180deg,#ef5350 0%,#c62828 100%);color:#fff;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:1.5px solid var(--bdr);border-radius:8px;font-size:11px;cursor:pointer;box-shadow:0 2px 0 #a5d6a7;position:relative;transition:transform .1s;}
.cal-cell:active{transform:translateY(1px);}
.cal-cell.work{background:#e8f5e9;border-color:#2e7d32;}
.cal-cell.today{background:#fff9c4;border-color:#fbc02d;}
.cal-header{font-size:10px;font-weight:700;color:var(--mut);padding:8px;text-align:center;}
.work-badge{position:absolute;top:2px;right:2px;background:#2e7d32;color:#fff;font-size:8px;padding:1px 4px;border-radius:3px;font-weight:700;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:1000;align-items:center;justify-content:center;}
.modal-content{background:#fff;border-radius:16px;padding:18px 16px;max-width:360px;width:92%;max-height:90vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,0.3);animation:pop .3s cubic-bezier(.68,-.55,.265,1.55);}
@keyframes pop{from{transform:scale(.8);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-title{font-size:15px;font-weight:700;margin-bottom:12px;text-align:center;}
.numpad-btn{height:42px;border-radius:10px;border:1.5px solid var(--bdr);background:#fff;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #a5d6a7;transition:transform .1s,box-shadow .1s;color:var(--txt);}
.numpad-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a5d6a7;}
.work-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--sur2);border-radius:8px;margin-bottom:6px;font-size:12px;}
.confirm-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:10000;align-items:center;justify-content:center;}
.confirm-box{background:#fff;border-radius:16px;padding:24px;max-width:300px;width:85%;}
.confirm-title{font-size:16px;font-weight:700;margin-bottom:10px;text-align:center;}
.confirm-message{font-size:13px;color:var(--mut);margin-bottom:18px;text-align:center;line-height:1.6;}
.confirm-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.confirm-btn{padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;}
.confirm-btn-cancel{background:var(--sur2);color:var(--txt);}
.send-bar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px;background:#fff;border-top:1.5px solid var(--bdr);box-shadow:0 -4px 12px rgba(0,0,0,.1);z-index:50;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:12px 24px;border-radius:8px;font-size:13px;font-weight:600;z-index:2000;display:none;max-width:80%;text-align:center;}
</style>
</head>
<body>
<div class="hdr"><h1>알바생 근무입력</h1></div>
<div class="pg">
<div class="card">
  <!-- 잠금 전 — 이름 선택 -->
  <div id="profileEdit">
    <div style="font-size:13px;font-weight:700;margin-bottom:10px;color:var(--txt);">이름 · 근무처 선택</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <div id="nameListWrap">
        <div style="font-size:10px;font-weight:700;color:var(--mut);margin-bottom:4px;">이름</div>
        <div id="nameList" style="display:flex;flex-direction:column;gap:6px;"></div>
      </div>
      <div>
        <div style="font-size:10px;font-weight:700;color:var(--mut);margin-bottom:4px;">근무처</div>
        <div id="selectedWp" style="padding:10px;border:1.5px solid var(--bdr);border-radius:8px;font-size:14px;font-weight:700;color:var(--mut);min-height:44px;display:flex;align-items:center;">-</div>
      </div>
    </div>
    <div id="confirmWrap" style="display:none;">
      <div style="font-size:13px;text-align:center;margin-bottom:10px;padding:10px;background:#fff9c4;border-radius:8px;border:1.5px solid #fbc02d;">
        <strong id="confirmName" style="font-size:15px;"></strong>님이 맞습니까?
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <button onclick="confirmProfile()" style="padding:11px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:linear-gradient(180deg,#43a047 0%,#2e7d32 100%);color:#fff;box-shadow:0 4px 0 #0a2e0f;">맞습니다</button>
        <button onclick="cancelConfirm()" style="padding:11px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:var(--sur2);color:var(--txt);">다시 선택</button>
      </div>
    </div>
  </div>
  <!-- 잠금 후 — 고정 표시 -->
  <div id="profileView" style="display:none;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <div style="background:var(--sur2);border-radius:10px;padding:12px;text-align:center;border:1.5px solid var(--bdr);">
        <div style="font-size:10px;font-weight:700;color:var(--mut);margin-bottom:4px;">이름</div>
        <div id="profileName" style="font-size:16px;font-weight:700;color:var(--txt);"></div>
      </div>
      <div style="background:var(--sur2);border-radius:10px;padding:12px;text-align:center;border:1.5px solid var(--bdr);">
        <div style="font-size:10px;font-weight:700;color:var(--mut);margin-bottom:4px;">근무처</div>
        <div id="profileWp" style="font-size:16px;font-weight:700;color:var(--acc);"></div>
      </div>
    </div>
    <div style="text-align:center;font-size:11px;color:var(--mut);">잠금됨 · 변경은 사장님께 요청하세요</div>
  </div>
</div>
<div class="card" id="calCard">
  <div style="display:flex;justify-content:center;align-items:center;margin-bottom:10px;">
    <div style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px;">
      <button class="btn-sm btn-sm-green" onclick="prevMonth()" style="padding:6px 10px;font-size:13px;">◀</button>
      <span id="calTitle">2026년 5월</span>
      <button class="btn-sm btn-sm-green" onclick="nextMonth()" style="padding:6px 10px;font-size:13px;">▶</button>
    </div>
  </div>
  <div class="cal" id="calendar"></div>
  <div style="margin-top:10px;font-size:11px;color:var(--mut);text-align:center;">날짜를 눌러 근무시간을 입력하세요</div>
</div>
<div class="card" id="summaryCard">
  <div class="card-title">이번 달 입력 현황</div>
  <div id="summaryList"></div>
</div>
</div>

<div class="send-bar">
  <button id="sendBtn" onclick="sendToManager()" style="width:100%;padding:13px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:linear-gradient(180deg,#43a047 0%,#2e7d32 100%);color:#fff;box-shadow:0 5px 0 #0a2e0f;">사장앱으로 전송</button>
</div>

<div class="modal" id="workModal">
<div class="modal-content">
  <div class="modal-title" id="workTitle">근무 입력</div>
  <input type="hidden" id="workDate"/>
  <input type="hidden" id="workIdx"/>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
    <div id="npStartBox" onclick="npSetActive('start')" style="text-align:center;padding:10px 6px;background:#e3f2fd;border:2.5px solid #1a73e8;border-radius:10px;cursor:pointer;">
      <div style="font-size:10px;font-weight:700;color:var(--mut);margin-bottom:3px;">출근</div>
      <div id="npStartText" style="font-size:20px;font-weight:700;font-family:'DM Mono',monospace;color:#1a73e8;letter-spacing:2px;">09:00</div>
    </div>
    <div id="npEndBox" onclick="npSetActive('end')" style="text-align:center;padding:10px 6px;background:#fff;border:2.5px solid var(--bdr);border-radius:10px;cursor:pointer;">
      <div style="font-size:10px;font-weight:700;color:var(--mut);margin-bottom:3px;">퇴근</div>
      <div id="npEndText" style="font-size:20px;font-weight:700;font-family:'DM Mono',monospace;color:var(--txt);letter-spacing:2px;">18:00</div>
    </div>
  </div>
  <div style="text-align:center;height:22px;margin-bottom:6px;">
    <span id="npBuffer" style="font-size:16px;font-family:'DM Mono',monospace;font-weight:700;color:var(--warn);letter-spacing:4px;"></span>
    <span id="npHint" style="font-size:11px;color:var(--mut);"></span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:210px;margin:0 auto 10px auto;">
    <button class="numpad-btn" onclick="npPress(1)">1</button>
    <button class="numpad-btn" onclick="npPress(2)">2</button>
    <button class="numpad-btn" onclick="npPress(3)">3</button>
    <button class="numpad-btn" onclick="npPress(4)">4</button>
    <button class="numpad-btn" onclick="npPress(5)">5</button>
    <button class="numpad-btn" onclick="npPress(6)">6</button>
    <button class="numpad-btn" onclick="npPress(7)">7</button>
    <button class="numpad-btn" onclick="npPress(8)">8</button>
    <button class="numpad-btn" onclick="npPress(9)">9</button>
    <button class="numpad-btn" style="background:#fff3e0;color:var(--warn);font-size:12px;" onclick="npClear()">C</button>
    <button class="numpad-btn" onclick="npPress(0)">0</button>
    <button class="numpad-btn" style="background:#fce4ec;color:var(--bad);font-size:14px;" onclick="npDel()">⌫</button>
  </div>
  <div id="existingWorks" style="margin-top:6px;"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">
    <button style="padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:linear-gradient(180deg,#43a047 0%,#2e7d32 100%);color:#fff;box-shadow:0 3px 0 #0a2e0f;" onclick="saveWork()">저장</button>
    <button style="padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:var(--sur2);color:var(--txt);" onclick="closeModal('workModal')">닫기</button>
  </div>
</div>
</div>

<div class="modal" id="sendModal">
<div class="modal-content">
  <div id="sendResult" style="text-align:center;padding:10px 0;font-size:14px;line-height:1.8;"></div>
  <button style="width:100%;margin-top:12px;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:var(--sur2);color:var(--txt);" onclick="closeModal('sendModal')">닫기</button>
</div>
</div>

<div class="confirm-modal" id="confirmModal">
<div class="confirm-box">
  <div class="confirm-title" id="confirmTitle">확인</div>
  <div class="confirm-message" id="confirmMessage"></div>
  <div class="confirm-buttons" id="confirmButtons"></div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY='alba_worker_recs';
const PROFILE_KEY='alba_worker_profile';
let curEmp=null, curDate=new Date(), curWorkDate='';
let empList=[], selectedTemp=null;

function genCode(name,wp){
  let hash=0; const str=name+wp;
  for(let i=0;i<str.length;i++) hash=((hash<<5)-hash)+str.charCodeAt(i);
  return Math.abs(hash).toString(36).toUpperCase().substring(0,4).padEnd(4,'0');
}

window.onload=()=>{
  const now=new Date();
  curDate=new Date(now.getFullYear(),now.getMonth(),1);
  const saved=localStorage.getItem(PROFILE_KEY);
  if(saved){
    const p=JSON.parse(saved);
    curEmp=p;
    showProfileView(p);
  } else {
    // Firebase 직원 목록 대기
    setTimeout(()=>{
      if(!window._fbEmps){
        const local=localStorage.getItem('alba_emp');
        if(local) renderNameList(JSON.parse(local));
      } else { renderNameList(window._fbEmps); }
    },2000);
  }
  renderCal(); renderSummary();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('worker-sw.js').catch(()=>{});
};

// 이름 버튼 목록 렌더링
function renderNameList(emps){
  empList=emps;
  const c=document.getElementById('nameList');
  if(!emps.length){
    c.innerHTML='<div style="font-size:12px;color:var(--mut);">사장앱에 직원이 등록되어 있지 않습니다</div>';
    return;
  }
  c.innerHTML=emps.map((e,i)=>
    `<button id="namebtn_${i}" onclick="selectName(${i})"
      style="width:100%;padding:10px;border-radius:8px;border:1.5px solid var(--bdr);
      background:#fff;font-size:14px;font-weight:700;cursor:pointer;text-align:left;
      transition:all .15s;">${e.name}</button>`
  ).join('');
}

// 이름 선택 (아직 확정 전)
function selectName(idx){
  if(empList[idx]._locked) return; // 비활성화된 이름
  selectedTemp=empList[idx];
  // 선택된 버튼 하이라이트, 나머지 비활성화
  empList.forEach((_,i)=>{
    const btn=document.getElementById('namebtn_'+i);
    if(!btn) return;
    if(i===idx){
      btn.style.background='#e8f5e9';
      btn.style.borderColor='#2e7d32';
      btn.style.color='#2e7d32';
    } else {
      btn.style.background='#f5f5f5';
      btn.style.borderColor='var(--bdr)';
      btn.style.color='#aaa';
      btn.style.cursor='default';
      btn.setAttribute('disabled','');
    }
  });
  // 근무처 표시
  document.getElementById('selectedWp').textContent=selectedTemp.wp||'-';
  document.getElementById('selectedWp').style.color='var(--acc)';
  document.getElementById('selectedWp').style.borderColor='#2e7d32';
  // 확인 버튼 표시
  document.getElementById('confirmName').textContent=selectedTemp.name;
  document.getElementById('confirmWrap').style.display='block';
}

// 확인 버튼 — 잠금
function confirmProfile(){
  if(!selectedTemp) return;
  const code=genCode(selectedTemp.name, selectedTemp.wp||'');
  const profile={name:selectedTemp.name, wp:selectedTemp.wp||'', code};
  localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
  curEmp=profile;
  showProfileView(profile);
  renderCal(); renderSummary();
  showToast('설정이 완료됐습니다. 변경은 사장님께 요청하세요.');
}

// 다시 선택
function cancelConfirm(){
  selectedTemp=null;
  document.getElementById('confirmWrap').style.display='none';
  document.getElementById('selectedWp').textContent='-';
  document.getElementById('selectedWp').style.color='var(--mut)';
  document.getElementById('selectedWp').style.borderColor='var(--bdr)';
  // 버튼 전체 다시 활성화
  empList.forEach((_,i)=>{
    const btn=document.getElementById('namebtn_'+i);
    if(!btn) return;
    btn.style.background='#fff';
    btn.style.borderColor='var(--bdr)';
    btn.style.color='var(--txt)';
    btn.style.cursor='pointer';
    btn.removeAttribute('disabled');
  });
}

// 프로필 고정 표시
function showProfileView(p){
  document.getElementById('profileEdit').style.display='none';
  document.getElementById('profileView').style.display='block';
  document.getElementById('profileName').textContent=p.name;
  document.getElementById('profileWp').textContent=p.wp;
}

// 사장앱 원격 잠금 해제
function unlockProfile(){
  curEmp=null;
  selectedTemp=null;
  document.getElementById('profileView').style.display='none';
  document.getElementById('profileEdit').style.display='block';
  document.getElementById('confirmWrap').style.display='none';
  // 이름 목록 재렌더링
  if(empList.length) renderNameList(empList);
  else if(window._fbEmps) renderNameList(window._fbEmps);
  renderCal(); renderSummary();
  showToast('사장님이 잠금을 해제했습니다. 다시 선택하세요.');
}

function prevMonth(){curDate.setMonth(curDate.getMonth()-1);renderCal();renderSummary();}
function nextMonth(){curDate.setMonth(curDate.getMonth()+1);renderCal();renderSummary();}
function getRecs(){return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');}
function saveRecs(r){localStorage.setItem(STORAGE_KEY,JSON.stringify(r));}

function renderCal(){
  const y=curDate.getFullYear(),m=curDate.getMonth();
  document.getElementById('calTitle').textContent=`${y}년 ${m+1}월`;
  const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
  const recs=getRecs();
  let html='';
  ['일','월','화','수','목','금','토'].forEach((d,i)=>html+=`<div class="cal-header" style="${i===0?'color:#ef5350':i===6?'color:#1976d2':''}">${d}</div>`);
  for(let i=0;i<first;i++)html+='<div></div>';
  const today=new Date();today.setHours(0,0,0,0);
  for(let d=1;d<=last;d++){
    const date=new Date(y,m,d);date.setHours(0,0,0,0);
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const works=curEmp?recs.filter(r=>r.emp===curEmp.name&&r.code===curEmp.code&&r.date===ds):[];
    let cls='cal-cell';

function copyText(text,resultEl){
  const done=()=>{resultEl.innerHTML='<div style="font-weight:700;font-size:14px;margin-bottom:8px;">클립보드에 복사됐습니다</div><div style="font-size:12px;color:var(--mut);">카카오톡·문자로 사장님께 붙여넣기로 보내주세요</div>';};
