<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc"/>
      <stop offset="100%" style="stop-color:#003d99"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- 배경 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="512" height="512" rx="100" fill="url(#shine)"/>
  <!-- 테두리 링 -->
  <rect x="20" y="20" width="472" height="472" rx="85" fill="none" stroke="#ffffff" stroke-width="12" stroke-opacity="0.3"/>
  <!-- 사장 B 텍스트 -->
  <text x="256" y="200" font-family="Arial, sans-serif" font-weight="900" font-size="160" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-8">B</text>
  <!-- 구분선 -->
  <rect x="80" y="240" width="352" height="6" rx="3" fill="#ffffff" opacity="0.4"/>
  <!-- 하단 텍스트 -->
  <text x="256" y="360" font-family="Arial, sans-serif" font-weight="700" font-size="72" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="8" opacity="0.9">BOSS</text>
  <!-- 하단 포인트 라인 -->
  <rect x="120" y="420" width="272" height="5" rx="2.5" fill="#4da6ff" opacity="0.8"/>
</svg>
